name: Build Apps
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q project.zip -d proj
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - run: gradle assembleDebug
        working-directory: proj/android
      - uses: actions/upload-artifact@v4
        with: {name: app-apk, path: proj/android/app/build/outputs/apk/debug/*.apk}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive project.zip -DestinationPath proj
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
        working-directory: proj/windows
      - run: npm run dist
        working-directory: proj/windows
      - uses: actions/upload-artifact@v4
        with: {name: app-exe, path: proj/windows/dist/*.exe}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q project.zip -d proj
      - run: brew install xcodegen && xcodegen generate
        working-directory: proj/ios
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
        working-directory: proj/ios
      - run: |
          mkdir Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr app.ipa Payload
        working-directory: proj/ios
      - uses: actions/upload-artifact@v4
        with: {name: app-ipa, path: proj/ios/app.ipa}
